data_root: "datasets/g1_factory"

language_instruction: "Move the power drill from one table to another"
task_index: 2

hdf5_name: "LMDrillPnP.hdf5"

# HDF5 observation and action fields
state_name_sim: "robot_joint_pos"
left_eef_pos_name_sim: "left_eef_pos"
left_eef_quat_name_sim: "left_eef_quat"
right_eef_pos_name_sim: "right_eef_pos"
right_eef_quat_name_sim: "right_eef_quat"
teleop_base_height_command_name_sim: "base_height_cmd"
teleop_navigate_command_name_sim: "navigate_cmd"
teleop_torso_orientation_rpy_command_name_sim: "torso_orientation_rpy_cmd"
action_name_sim: "processed_actions"
pov_cam_name_sim: "robot_head_cam_rgb"

# LeRobot fields
state_name_lerobot: "observation.state"
action_name_lerobot: "action"
action_eef_name_sim: "action.eef"
video_name_lerobot: "observation.images.ego_view"
task_description_lerobot: "annotation.human.task_description"

chunks_size: 1000

fps: 50

# File path templates
data_path: "data/chunk-{episode_chunk:03d}/episode_{episode_index:06d}.parquet"
video_path: "videos/chunk-{episode_chunk:03d}/{video_key}/episode_{episode_index:06d}.mp4"

# Configuration file paths (under isaaclab_arena_gr00t/embodiments/g1/)
modality_template_path: "submodules/IsaacLab-Arena/isaaclab_arena_gr00t/embodiments/g1/modality.json"
modality_fname: "modality.json"
episodes_fname: "episodes.jsonl"
tasks_fname: "tasks.jsonl"
info_template_path: "submodules/IsaacLab-Arena/isaaclab_arena_gr00t/embodiments/g1/info.json"
info_fname: "info.json"

# GR00T joint mapping
policy_joints_config_path: "submodules/IsaacLab-Arena/isaaclab_arena_gr00t/embodiments/g1/gr00t_43dof_joint_space.yaml"
robot_type: "unitree_g1"

# Simulation joint mappings
action_joints_config_path: "submodules/IsaacLab-Arena/isaaclab_arena_gr00t/embodiments/g1/43dof_joint_space.yaml"
state_joints_config_path: "submodules/IsaacLab-Arena/isaaclab_arena_gr00t/embodiments/g1/43dof_joint_space.yaml"

# Image configuration (height, width, channels)
original_image_size: [480, 640, 3]
target_image_size: [480, 640, 3]
